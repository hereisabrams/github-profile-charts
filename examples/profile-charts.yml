# Copy to .github/workflows/profile-charts.yml in your <username>/<username> repository.
name: Profile charts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hereisabrams/github-profile-charts@v1
        with:
          accent: blue
          readme: README.md
          # Optional: a personal access token (repo scope) stored as a secret adds
          # private merged PRs and the languages chart.
          stats-token: ${{ secrets.STATS_TOKEN }}
